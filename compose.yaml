services:
  invite:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Укажите ADMIN_PASSWORD в .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
    volumes:
      - invite_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
volumes:
  invite_data:
